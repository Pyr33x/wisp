<style>
:root {
  --brand: #ff4f00;
  --brand-ink: #c43c00;
  --on-brand: #ffffff;
  --on-brand-soft: rgba(255, 255, 255, .78);
  --card: #ffffff;
  --ink: #1d1b19;
  --ink-soft: #6b625b;
  --line: #ece5df;
  --field: #faf7f4;
  --ok: #0f7a3d;
  --bad: #b3261e;
  --radius: 18px;
  --shadow: 0 1px 0 rgba(0,0,0,.04), 0 18px 40px -18px rgba(90, 30, 0, .45);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --brand: #f24a00;
    --brand-ink: #ff7a3d;
    --card: #1c1917;
    --ink: #f5f1ed;
    --ink-soft: #a89f97;
    --line: #2e2925;
    --field: #24201d;
    --ok: #5fd08f;
    --bad: #ff8a80;
    --shadow: 0 18px 40px -18px rgba(0,0,0,.7);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--brand);
  color: var(--ink);
  font: 16px/1.5 ui-rounded, "SF Pro Rounded", "Nunito", "Varela Round", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
a { color: inherit; }
.wrap { max-width: 720px; margin: 0 auto; padding: 28px 16px 48px; }

/* header mark, like the banner's [ cloud GO ] */
.mark { display: inline-flex; color: var(--on-brand); text-decoration: none; border-radius: 8px; }
.mark .logo { display: block; width: clamp(120px, 28vw, 168px); height: auto; }

/* hero wordmark */
.hero { text-align: center; color: var(--on-brand); margin: 44px 0 34px; }
.word { display: inline-block; position: relative; padding: 22px 0; }
.word h1 {
  margin: 0; font-size: clamp(76px, 22vw, 168px); line-height: .9;
  font-weight: 900; letter-spacing: -.02em;
}
.word .tag { position: absolute; font-size: clamp(13px, 2.6vw, 17px); font-weight: 700; color: var(--on-brand-soft); white-space: nowrap; }
.word .tl { top: 0; left: 2px; }
.word .br2 { bottom: 0; right: 2px; }
.hero p { margin: 18px auto 0; max-width: 34ch; color: var(--on-brand-soft); font-weight: 600; }

/* cards */
.card {
  background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 20px; margin-top: 16px;
}
.card h2 { margin: 0 0 12px; font-size: 15px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-soft); }
.row { display: flex; gap: 10px; }
input[type=url], input[type=text] {
  flex: 1; min-width: 0; height: 52px; padding: 0 16px;
  font: inherit; color: var(--ink); background: var(--field);
  border: 2px solid var(--line); border-radius: 14px; outline: none;
  transition: border-color .15s;
}
input:focus { border-color: var(--brand); }
button {
  height: 52px; padding: 0 20px; border: 0; border-radius: 14px; cursor: pointer;
  font: inherit; font-weight: 800; color: var(--on-brand); background: var(--brand);
  transition: transform .06s, filter .15s, opacity .15s; white-space: nowrap;
}
button:hover { filter: brightness(1.06); }
button:active { transform: translateY(1px); }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid var(--brand-ink); outline-offset: 2px; }
button[disabled] { opacity: .55; cursor: not-allowed; }
button.ghost { background: transparent; color: var(--brand-ink); border: 2px solid var(--line); height: 40px; padding: 0 14px; font-size: 14px; }

.msg { min-height: 1.5em; margin: 10px 2px 0; font-size: 14px; font-weight: 600; }
.msg.bad { color: var(--bad); }
.msg.ok { color: var(--ok); }

.result {
  display: none; margin-top: 14px; padding: 14px 16px; border-radius: 14px;
  background: var(--field); border: 2px dashed var(--line);
  align-items: center; gap: 12px;
}
.result.show { display: flex; }
.result .short { flex: 1; min-width: 0; }
.result .short a { font-weight: 800; font-size: 19px; color: var(--brand-ink); text-decoration: none; word-break: break-all; }
.result .origin { display: block; font-size: 13px; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.stat { display: none; margin-top: 14px; align-items: baseline; gap: 10px; }
.stat.show { display: flex; }
.stat .n { font-size: 44px; font-weight: 900; line-height: 1; color: var(--brand-ink); }
.stat .l { color: var(--ink-soft); font-weight: 600; }

.recent-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 4px; }
.recent-head h2 { margin: 0; }
.list { list-style: none; margin: 8px 0 0; padding: 0; }
.list li {
  display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center;
  padding: 12px 0; border-top: 1px solid var(--line);
}
.list li:first-child { border-top: 0; }
.list .meta { min-width: 0; }
.list .meta a { font-weight: 800; color: var(--brand-ink); text-decoration: none; }
.list .meta span { display: block; font-size: 13px; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list .clicks { font-weight: 800; font-variant-numeric: tabular-nums; text-align: right; min-width: 4.5ch; }
.list .clicks small { display: block; font-size: 11px; font-weight: 700; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .04em; }
.empty { color: var(--ink-soft); font-size: 14px; margin: 6px 0 0; }
.note { font-size: 12px; color: var(--ink-soft); margin: 10px 0 0; }

footer { text-align: center; margin-top: 30px; color: var(--on-brand-soft); font-size: 14px; font-weight: 700; }
footer a { color: var(--on-brand); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (max-width: 520px) {
  .row { flex-direction: column; }
  .row input { flex: none; width: 100%; }
  button { width: 100%; }
  button.ghost { width: auto; }
  .result { flex-direction: column; align-items: stretch; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

  <header class="hero">
    <div class="word">
      <span class="tag tl">built in go</span>
      <h1>WISP</h1>
      <span class="tag br2">deployed on workers</span>
    </div>
  </header>

  <main>
    <section class="card" aria-labelledby="h-shorten">
      <h2 id="h-shorten">Shorten</h2>
      <form id="shorten" novalidate>
        <div class="row">
          <label class="sr" for="url">Long URL</label>
          <input id="url" name="url" type="url" inputmode="url" autocomplete="off" spellcheck="false"
                 placeholder="https://example.com/a/very/long/link" required maxlength="2048">
          <button id="go" type="submit">Shorten</button>
        </div>
        <p id="shorten-msg" class="msg" role="status" aria-live="polite"></p>
      </form>
      <div id="result" class="result" aria-live="polite">
        <div class="short">
          <a id="short" href="#" target="_blank" rel="noopener noreferrer"></a>
          <span id="origin" class="origin"></span>
        </div>
        <button id="copy" type="button">Copy</button>
      </div>
    </section>

    <section class="card" aria-labelledby="h-stats">
      <h2 id="h-stats">Click stats</h2>
      <form id="stats" novalidate>
        <div class="row">
          <label class="sr" for="code">Short link or code</label>
          <input id="code" name="code" type="text" autocomplete="off" spellcheck="false"
                 placeholder="wisp.pyr33x.top/aZ3k9Qx or aZ3k9Qx">
          <button type="submit">Look up</button>
        </div>
        <p id="stats-msg" class="msg" role="status" aria-live="polite"></p>
      </form>
      <div id="stat" class="stat" aria-live="polite">
        <span id="stat-n" class="n">0</span><span id="stat-l" class="l">clicks</span>
      </div>
    </section>

    <section class="card" aria-labelledby="h-recent">
      <div class="recent-head">
        <h2 id="h-recent">Your recent links</h2>
        <button id="refresh" class="ghost" type="button" hidden>Refresh counts</button>
      </div>
      <ul id="list" class="list"></ul>
      <p id="empty" class="empty">Links you shorten here will show up in this list.</p>
      <p class="note">Saved only in this browser. Clearing site data removes the list, not the links.</p>
    </section>
  </main>

  <footer>
    built in go · deployed on workers · <a href="https://github.com/Pyr33x/wisp" rel="noopener">source</a>
  </footer>
</div>

<script>
(function () {
  "use strict";

  var KEY = "wisp.recent";
  var MAX = 10;
  var CODE = /^[0-9A-Za-z]{7}$/;

  function $(id) { return document.getElementById(id); }

  function say(el, text, kind) {
    el.textContent = text || "";
    el.className = "msg" + (kind ? " " + kind : "");
  }

  // Storage can be blocked (private mode, disabled site data): the page must
  // work without it, so every access is guarded.
  function load() {
    try {
      var v = JSON.parse(localStorage.getItem(KEY) || "[]");
      return Array.isArray(v) ? v.filter(function (x) { return x && CODE.test(x.code); }) : [];
    } catch (e) { return []; }
  }
  function save(list) {
    try { localStorage.setItem(KEY, JSON.stringify(list.slice(0, MAX))); } catch (e) {}
  }

  function api(method, path, body) {
    var init = { method: method, headers: {} };
    if (body) {
      init.headers["Content-Type"] = "application/json";
      init.body = JSON.stringify(body);
    }
    return fetch(path, init).then(function (res) {
      return res.text().then(function (text) {
        var data = null;
        try { data = text ? JSON.parse(text) : null; } catch (e) {}
        return { status: res.status, data: data, retry: res.headers.get("Retry-After") };
      });
    });
  }

  function errorText(r) {
    if (r.data && r.data.error && r.data.error.message) {
      var m = r.data.error.message;
      return m.charAt(0).toUpperCase() + m.slice(1) + ".";
    }
    return "Something went wrong (" + r.status + "). Try again.";
  }

  function safeHref(u) { return /^https?:\/\//i.test(u) ? u : "#"; }

  // ── shorten ────────────────────────────────────────────────────────────
  var form = $("shorten"), input = $("url"), go = $("go"), msg = $("shorten-msg");
  var result = $("result"), shortA = $("short"), originEl = $("origin"), copyBtn = $("copy");
  var cooldown = 0;

  function lock(seconds) {
    var left = Math.max(1, parseInt(seconds, 10) || 60);
    clearInterval(cooldown);
    go.disabled = true;
    function tick() {
      if (left <= 0) {
        clearInterval(cooldown); go.disabled = false; go.textContent = "Shorten";
        say(msg, "");
        return;
      }
      go.textContent = "Wait " + left + "s";
      left--;
    }
    tick();
    cooldown = setInterval(tick, 1000);
  }

  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var url = input.value.trim();
    if (!url) { say(msg, "Paste a link first.", "bad"); input.focus(); return; }
    if (!/^https?:\/\//i.test(url)) { url = "https://" + url; }
    go.disabled = true; go.textContent = "Shortening…"; say(msg, "");
    api("POST", "/api/links", { url: url }).then(function (r) {
      if (r.status === 201 && r.data && r.data.code) {
        shortA.textContent = r.data.short_url.replace(/^https?:\/\//, "");
        shortA.href = safeHref(r.data.short_url);
        originEl.textContent = r.data.origin;
        result.classList.add("show");
        copyBtn.textContent = "Copy";
        say(msg, "Done.", "ok");
        input.value = "";
        var list = load().filter(function (x) { return x.code !== r.data.code; });
        list.unshift({ code: r.data.code, short_url: r.data.short_url, origin: r.data.origin, created_at: r.data.created_at });
        save(list);
        render();
        go.disabled = false; go.textContent = "Shorten";
        return;
      }
      if (r.status === 429) {
        say(msg, errorText(r), "bad");
        lock(r.retry);
        return;
      }
      say(msg, errorText(r), "bad");
      go.disabled = false; go.textContent = "Shorten";
    }).catch(function () {
      say(msg, "Network error. Check your connection and try again.", "bad");
      go.disabled = false; go.textContent = "Shorten";
    });
  });

  function copy(text, btn) {
    function done(ok) {
      btn.textContent = ok ? "Copied!" : "Copy failed";
      setTimeout(function () { btn.textContent = "Copy"; }, 1600);
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(false); });
      return;
    }
    var ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
    done(ok);
  }
  copyBtn.addEventListener("click", function () { copy(shortA.href, copyBtn); });

  // ── stats ──────────────────────────────────────────────────────────────
  var statsForm = $("stats"), codeIn = $("code"), statsMsg = $("stats-msg");
  var stat = $("stat"), statN = $("stat-n"), statL = $("stat-l");

  function codeOf(text) {
    var t = text.trim().replace(/[?#].*$/, "").replace(/\/+$/, "");
    var last = t.slice(t.lastIndexOf("/") + 1);
    return CODE.test(last) ? last : "";
  }

  function clicks(code) {
    return api("GET", "/api/links/" + code + "/stats").then(function (r) {
      if (r.status === 200 && r.data) { return { ok: true, n: r.data.clicks || 0 }; }
      return { ok: false, r: r };
    });
  }

  statsForm.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var code = codeOf(codeIn.value);
    stat.classList.remove("show");
    if (!code) { say(statsMsg, "That doesn't look like a wisp link or 7-character code.", "bad"); return; }
    say(statsMsg, "Looking up…");
    clicks(code).then(function (c) {
      if (c.ok) {
        statN.textContent = c.n.toLocaleString();
        statL.textContent = (c.n === 1 ? "click" : "clicks") + " on " + code;
        stat.classList.add("show");
        say(statsMsg, "");
        return;
      }
      say(statsMsg, c.r.status === 404 ? "No link with that code (it may have been deleted)." : errorText(c.r), "bad");
    }).catch(function () { say(statsMsg, "Network error. Try again.", "bad"); });
  });

  // ── recent ─────────────────────────────────────────────────────────────
  var listEl = $("list"), empty = $("empty"), refresh = $("refresh");

  function render() {
    var list = load();
    listEl.textContent = "";
    empty.hidden = list.length > 0;
    refresh.hidden = list.length === 0;
    list.forEach(function (item) {
      var li = document.createElement("li");

      var meta = document.createElement("div"); meta.className = "meta";
      var a = document.createElement("a");
      a.href = safeHref(item.short_url); a.target = "_blank"; a.rel = "noopener noreferrer";
      a.textContent = String(item.short_url || "").replace(/^https?:\/\//, "");
      var o = document.createElement("span"); o.textContent = item.origin || "";
      meta.appendChild(a); meta.appendChild(o);

      var c = document.createElement("div"); c.className = "clicks";
      c.dataset.code = item.code;
      c.textContent = "–";
      var lbl = document.createElement("small"); lbl.textContent = "clicks";
      c.appendChild(lbl);

      var b = document.createElement("button");
      b.type = "button"; b.className = "ghost"; b.textContent = "Copy";
      b.addEventListener("click", function () { copy(item.short_url, b); });

      li.appendChild(meta); li.appendChild(c); li.appendChild(b);
      listEl.appendChild(li);
    });
  }

  function refreshCounts() {
    var cells = listEl.querySelectorAll(".clicks");
    var gone = [];
    var jobs = Array.prototype.map.call(cells, function (cell) {
      var code = cell.dataset.code;
      return clicks(code).then(function (c) {
        var label = cell.querySelector("small");
        if (c.ok) { cell.firstChild.nodeValue = c.n.toLocaleString(); }
        else if (c.r.status === 404) { cell.firstChild.nodeValue = "gone"; gone.push(code); }
        else { cell.firstChild.nodeValue = "?"; }
        cell.appendChild(label);
      }).catch(function () {});
    });
    return Promise.all(jobs).then(function () {
      if (gone.length) { save(load().filter(function (x) { return gone.indexOf(x.code) < 0; })); }
    });
  }

  refresh.addEventListener("click", function () {
    refresh.disabled = true;
    refreshCounts().then(function () { refresh.disabled = false; });
  });

  render();
  // Counts load on demand only: each lookup costs Worker requests from the
  // free-plan quota, so the page never fans out stats calls on its own.
})();
</script>
</body>
