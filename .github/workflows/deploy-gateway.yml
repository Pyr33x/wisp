# Deploys wisp-gateway when its code, or code it compiles in, changes on main.
name: Deploy gateway

on:
  push:
    branches: [master]
    paths:
      - services/gateway/**
      - gateway/**
      - shared/**
      - transport/**
      - platform/**
      - cmd/migrate/**
      - go.mod
      - go.sum
      - .github/workflows/deploy-gateway.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-gateway
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    # Shows up under "Deployments" on the repo page, linking to the live URL.
    environment:
      name: production
      url: ${{ vars.WISP_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      # The goflare action builds web/edge/main.go at the repo root and has no
      # working-directory input: stage this Worker there. No web/public is
      # staged, so this is a Worker-only deploy and every path reaches Go.
      - name: Stage wisp-gateway at the repo root
        run: cp -R services/gateway/web web
      # Pinned to a full version: a floating @v1 downloads the latest goflare,
      # whose embedded webtyp.com/cloudflare may no longer match go.mod.
      - uses: webtyp/goflare@v0.5.69
        with:
          worker: wisp-gateway
          domain: ${{ vars.WISP_DOMAIN }}
          d1-binding: DB
          d1-name: wisp-gateway
          compatibility-date: '2026-08-01'
          vars: |
            BASE_URL=${{ vars.WISP_BASE_URL }}
            LINK_URL=${{ vars.WISP_LINK_URL }}
            ANALYTICS_URL=${{ vars.WISP_ANALYTICS_URL }}
          # gotest already ran in the ci job; the action's plain go test is skipped.
          test: ''
          # Schema migration through goflare.NewD1Migrator, before the upload.
          # The action exports D1_DATABASE_ID (from goflare d1-id) for it.
          pre-deploy: go run ./cmd/migrate -service gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
